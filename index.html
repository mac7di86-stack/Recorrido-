<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d3e">
<meta name="robots" content="noindex,nofollow">
<title>Recorrido</title>
<style>
:root{
  --bg:#f4f1ea; --card:#ffffff; --ink:#1b2a2b; --muted:#5c6b6c; --brand:#0f3d3e; --brand2:#1f6f6b;
  --ok:#1e7b43; --warn:#b26a00; --bad:#b3261e; --line:#d9d4c7; --soft:#e8f1ef;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.35}
#app{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:1.5rem;margin:.2rem 0 .4rem}
h2{font-size:1.15rem;margin:1.2rem 0 .5rem}
p{margin:.4rem 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.role{display:inline-block;background:var(--brand);color:#fff;border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.muted{color:var(--muted);font-size:.9rem}
.big{width:100%;border:0;border-radius:18px;padding:22px 16px;font-size:1.3rem;font-weight:700;color:#fff;background:var(--brand);cursor:pointer;min-height:68px}
.big:active{transform:scale(.98)}
.big.green{background:var(--ok)} .big.red{background:var(--bad)} .big.light{background:var(--soft);color:var(--brand)}
.btn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 12px;font-size:1rem;font-weight:600;color:var(--ink);cursor:pointer;min-height:56px}
.btn:active{background:var(--soft)}
.btn.sm{padding:8px 12px;min-height:40px;font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--soft);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.pulse{animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(30,123,67,.5)}100%{box-shadow:0 0 0 12px rgba(30,123,67,0)}}
.check{font-size:3rem;text-align:center;margin:.2rem 0}
.timer{font-size:2.6rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:.2rem 0}
.log{margin:0;padding:0;list-style:none;font-size:.95rem}
.log li{padding:6px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.log li:last-child{border:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--brand);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;font-size:.95rem}
.banner.warn{background:#fff3dc;color:#6b4300;border:1px solid #f0d49a}
.banner.bad{background:#fde7e5;color:#7a1710;border:1px solid #f1b7b2}
input,textarea{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.95rem}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
a{color:var(--brand2)}
.qrbox{background:#fff;padding:8px;border-radius:12px;display:inline-block;line-height:0}
.qrbox svg{width:230px;height:230px}
#app.wide{max-width:900px}
</style>
</head>

<script>/* Generador QR mínimo (modo byte, nivel L o M, versiones 1-10). Sin dependencias. */
(function (root) {
  var ECC = { L: 1, M: 0 };
  var ECC_PER_BLOCK = {
    L: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18],
    M: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26]
  };
  var NUM_BLOCKS = {
    L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4],
    M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5]
  };

  function rawModules(ver) {
    var r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  function dataCodewords(ver, lvl) {
    return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[lvl][ver] * NUM_BLOCKS[lvl][ver];
  }
  function mul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 255;
  }
  function divisor(d) {
    var r = [], i, j;
    for (i = 0; i < d - 1; i++) r.push(0);
    r.push(1);
    var root = 1;
    for (i = 0; i < d; i++) {
      for (j = 0; j < d; j++) {
        r[j] = mul(r[j], root);
        if (j + 1 < d) r[j] ^= r[j + 1];
      }
      root = mul(root, 2);
    }
    return r;
  }
  function remainder(data, div) {
    var r = div.map(function () { return 0; });
    data.forEach(function (b) {
      var f = b ^ r.shift();
      r.push(0);
      div.forEach(function (c, i) { r[i] ^= mul(c, f); });
    });
    return r;
  }
  function utf8(str) {
    var s = unescape(encodeURIComponent(str)), out = [];
    for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
    return out;
  }
  function bit(x, i) { return ((x >>> i) & 1) !== 0; }

  function make(text, lvl) {
    lvl = lvl || 'M';
    var bytes = utf8(text), ver, bits = [];
    function push(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
    for (ver = 1; ver <= 10; ver++) {
      var ccBits = ver <= 9 ? 8 : 16;
      if (4 + ccBits + bytes.length * 8 <= dataCodewords(ver, lvl) * 8) break;
    }
    if (ver > 10) throw new Error('texto demasiado largo para el QR');
    push(4, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    bytes.forEach(function (b) { push(b, 8); });
    var cap = dataCodewords(ver, lvl) * 8;
    for (var t = 0; t < 4 && bits.length < cap; t++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    var data = [];
    for (var i = 0; i < bits.length; i += 8) {
      var v = 0;
      for (var j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      data.push(v);
    }
    for (var pad = 0xec; data.length < cap / 8; pad ^= 0xec ^ 0x11) data.push(pad);

    // ECC + interleave
    var nb = NUM_BLOCKS[lvl][ver], eccLen = ECC_PER_BLOCK[lvl][ver];
    var raw = Math.floor(rawModules(ver) / 8);
    var nShort = nb - (raw % nb), shortLen = Math.floor(raw / nb);
    var blocks = [], k = 0, div = divisor(eccLen);
    for (i = 0; i < nb; i++) {
      var dl = shortLen - eccLen + (i < nShort ? 0 : 1);
      var dat = data.slice(k, k + dl);
      k += dl;
      var ecc = remainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    var all = [];
    for (i = 0; i < blocks[0].length; i++) {
      blocks.forEach(function (blk, j) {
        if (i !== shortLen - eccLen || j >= nShort) all.push(blk[i]);
      });
    }

    var size = ver * 4 + 17, mod = [], fn = [];
    for (i = 0; i < size; i++) {
      mod.push(new Array(size).fill(false));
      fn.push(new Array(size).fill(false));
    }
    function setF(x, y, v) { mod[y][x] = v; fn[y][x] = true; }

    for (i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    function finder(x, y) {
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
        var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) setF(xx, yy, d !== 2 && d !== 4);
      }
    }
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    var pos = [];
    if (ver > 1) {
      var na = Math.floor(ver / 7) + 2;
      var step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2;
      pos = [6];
      for (var p = size - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
    }
    pos.forEach(function (a, ia) {
      pos.forEach(function (b, ib) {
        if ((ia === 0 && ib === 0) || (ia === 0 && ib === pos.length - 1) || (ia === pos.length - 1 && ib === 0)) return;
        for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++)
          setF(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      });
    });
    function drawFormat(mask) {
      var d = (ECC[lvl] << 3) | mask, r = d;
      for (var q = 0; q < 10; q++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      var b = ((d << 10) | r) ^ 0x5412, q2;
      for (q2 = 0; q2 <= 5; q2++) setF(8, q2, bit(b, q2));
      setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
      for (q2 = 9; q2 < 15; q2++) setF(14 - q2, 8, bit(b, q2));
      for (q2 = 0; q2 < 8; q2++) setF(size - 1 - q2, 8, bit(b, q2));
      for (q2 = 8; q2 < 15; q2++) setF(8, size - 15 + q2, bit(b, q2));
      setF(8, size - 8, true);
    }
    drawFormat(0);
    if (ver >= 7) {
      var rr = ver;
      for (i = 0; i < 12; i++) rr = (rr << 1) ^ ((rr >>> 11) * 0x1f25);
      var vb = (ver << 12) | rr;
      for (i = 0; i < 18; i++) {
        var c = bit(vb, i), a = size - 11 + (i % 3), b2 = Math.floor(i / 3);
        setF(a, b2, c); setF(b2, a, c);
      }
    }
    // colocar datos
    var bi = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var vert = 0; vert < size; vert++) {
        for (var jj = 0; jj < 2; jj++) {
          var x = right - jj, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
          if (!fn[y][x] && bi < all.length * 8) { mod[y][x] = bit(all[bi >>> 3], 7 - (bi & 7)); bi++; }
        }
      }
    }
    function applyMask(m) {
      for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) {
        var inv;
        switch (m) {
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: inv = (x * y) % 2 + (x * y) % 3 === 0; break;
          case 6: inv = ((x * y) % 2 + (x * y) % 3) % 2 === 0; break;
          default: inv = ((x + y) % 2 + (x * y) % 3) % 2 === 0;
        }
        if (!fn[y][x] && inv) mod[y][x] = !mod[y][x];
      }
    }
    function penalty() {
      var score = 0, x, y, run, line, dark = 0;
      var pat1 = '10111010000', pat2 = '00001011101';
      function lineScore(s) {
        var sc = 0, r = 1, k2;
        for (k2 = 1; k2 < s.length; k2++) {
          if (s[k2] === s[k2 - 1]) { r++; if (r === 5) sc += 3; else if (r > 5) sc++; } else r = 1;
        }
        var idx = -1;
        while ((idx = s.indexOf(pat1, idx + 1)) >= 0) sc += 40;
        idx = -1;
        while ((idx = s.indexOf(pat2, idx + 1)) >= 0) sc += 40;
        return sc;
      }
      for (y = 0; y < size; y++) {
        line = ''; for (x = 0; x < size; x++) { line += mod[y][x] ? '1' : '0'; if (mod[y][x]) dark++; }
        score += lineScore(line);
      }
      for (x = 0; x < size; x++) {
        line = ''; for (y = 0; y < size; y++) line += mod[y][x] ? '1' : '0';
        score += lineScore(line);
      }
      for (y = 0; y < size - 1; y++) for (x = 0; x < size - 1; x++) {
        var c0 = mod[y][x];
        if (c0 === mod[y][x + 1] && c0 === mod[y + 1][x] && c0 === mod[y + 1][x + 1]) score += 3;
      }
      var total = size * size;
      score += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return score;
    }
    var best = 0, bestScore = Infinity;
    for (var m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      var ps = penalty();
      if (ps < bestScore) { bestScore = ps; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return { size: size, version: ver, modules: mod, mask: best };
  }

  function svg(text, scale, lvl) {
    var q = make(text, lvl), s = scale || 6, border = 4, n = q.size + border * 2, d = '';
    for (var y = 0; y < q.size; y++) for (var x = 0; x < q.size; x++)
      if (q.modules[y][x]) d += 'M' + (x + border) + ',' + (y + border) + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" width="' + n * s + '" height="' + n * s +
      '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }

  root.QR = { make: make, svg: svg };
  if (typeof module !== 'undefined') module.exports = root.QR;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* ============ Configuración ============ */
var SUPABASE_URL = 'https://ogvrwwxwpdhtdqwtbuuv.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ndnJ3d3h3cGRodGRxd3RidXV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NzcxNDUsImV4cCI6MjEwNTM1MzE0NX0.TkMyNdEuJ7GOzMZ7bV7COSRZ-pp5UsvOF8IBQqSrwYg';
var TZ = 'America/Mexico_City';
var GPS_MIN_INTERVAL_MS = 5000;   // máximo un punto cada 5 s
var FLUSH_INTERVAL_MS = 15000;    // envío de lotes cada 15 s
var GPS_LOST_AFTER_MS = 30000;    // sin fix > 30 s = señal perdida

/* ============ Utilidades ============ */
var $app = document.getElementById('app');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtTime(ts){ if(!ts) return '—'; return new Date(ts).toLocaleTimeString('es-MX',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}); }
function fmtDT(ts){ if(!ts) return '—'; return new Date(ts).toLocaleString('es-MX',{timeZone:TZ,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}); }
function fmtDur(ms){ if(ms==null||isNaN(ms)) return '—'; var s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60; return (h?h+' h ':'')+(h||m?m+' min ':'')+r+' s'; }
function clock(ms){ var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60; return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'; clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className='toast'; },2200); }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function baseUrl(){ return location.origin + location.pathname; }
function link(role, code){ return baseUrl() + '#/' + role + '/' + code; }

/* ============ API + cola sin conexión ============ */
function rpcRaw(fn, args){
  return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},
    body: JSON.stringify(args)
  }).then(function(r){
    return r.text().then(function(t){
      var j; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = null; }
      if(!r.ok){ var err = new Error((j && (j.message||j.hint)) || ('http_'+r.status)); err.status = r.status; throw err; }
      return j;
    });
  });
}
var Q = {
  key:'rec_queue', flushing:false,
  items:function(){ return lsGet(this.key, []); },
  add:function(fn,args){ var a=this.items(); a.push({fn:fn,args:args}); lsSet(this.key,a); this.flush(); },
  flush:function(){
    var self=this; if(self.flushing) return; self.flushing=true;
    function step(){
      var a=self.items();
      if(!a.length){ self.flushing=false; Net.set(true); return; }
      var it=a[0];
      rpcRaw(it.fn,it.args).then(function(){ a=self.items(); a.shift(); lsSet(self.key,a); step(); },
        function(err){
          if(err && err.status && err.status<500 && err.status!==408 && err.status!==429){ a=self.items(); a.shift(); lsSet(self.key,a); step(); }
          else { self.flushing=false; Net.set(false); }
        });
    }
    step();
  }
};
var Net = { ok:true, set:function(v){ if(this.ok!==v){ this.ok=v; var el=document.getElementById('netdot'); if(el){ el.className='dot'+(v?'':' warn'); } var tx=document.getElementById('nettxt'); if(tx) tx.textContent=v?'Conectado':'Sin conexión: se guarda y se envía después'; } } };
window.addEventListener('online', function(){ Q.flush(); });
setInterval(function(){ if(Q.items().length) Q.flush(); }, 10000);

/* ============ Estado del viaje ============ */
var ctx = { code:null, role:null, trip:null, poll:null, tick:null };
function loadTrip(){
  return rpcRaw('rec_get_trip',{p_code:ctx.code}).then(function(t){ ctx.trip=t; Net.set(true); return t; });
}
function doneHas(role,type){ var d=(ctx.trip&&ctx.trip.done)||[]; return d.indexOf(role+':'+type)>=0 || lsGet('rec_done_'+ctx.code+'_'+role+'_'+type,false); }
function logEvent(role,type,note,extra){
  var pos = Geo.last;
  var args = {
    p_code:ctx.code, p_client_id:uid(), p_role:role, p_type:type, p_note:note||null,
    p_lat: pos?pos.lat:null, p_lng: pos?pos.lng:null, p_acc: pos?pos.acc:null,
    p_ts:new Date().toISOString(), p_meta: extra||null
  };
  Q.add('rec_event',args);
  return args.p_ts;
}
function logOnce(role,type,note,extra){ // registra una vez por navegador/viaje
  var k='rec_done_'+ctx.code+'_'+role+'_'+type;
  if(lsGet(k,false)) return;
  lsSet(k,true); logEvent(role,type,note,extra);
}
function deviceMeta(){ return {ua:navigator.userAgent, lang:navigator.language, w:screen.width, h:screen.height, online:navigator.onLine}; }

/* ============ Geolocalización ============ */
var Geo = {
  watchId:null, last:null, lastSaved:0, lastFix:0, buffer:[], state:'inactivo', lostLogged:false, wd:null, fl:null,
  start:function(){
    var self=this;
    if(!navigator.geolocation){ self.state='no_soportado'; return false; }
    if(self.watchId!=null) return true;
    self.buffer = lsGet('rec_pts_'+ctx.code, []);
    self.lastFix = Date.now(); self.state='buscando';
    self.watchId = navigator.geolocation.watchPosition(function(p){
      var now=Date.now(); self.lastFix=now;
      var c=p.coords; self.last={lat:c.latitude,lng:c.longitude,acc:c.accuracy,spd:c.speed,hdg:c.heading};
      if(self.state!=='ok'){ if(self.lostLogged){ logEvent('chofer','gps_recuperado'); self.lostLogged=false; } self.state='ok'; self.ui(); }
      if(now-self.lastSaved<GPS_MIN_INTERVAL_MS) return;
      self.lastSaved=now;
      self.buffer.push({lat:c.latitude,lng:c.longitude,acc:c.accuracy,spd:c.speed,hdg:c.heading,ts:new Date(p.timestamp||now).toISOString()});
      lsSet('rec_pts_'+ctx.code,self.buffer);
    }, function(e){
      if(e.code===1){ if(self.state!=='denegado'){ self.state='denegado'; logEvent('chofer','gps_permiso_denegado'); self.ui(); } }
      else { if(self.state==='ok'){ self.state='perdida'; } self.ui(); }
    }, {enableHighAccuracy:true,maximumAge:0,timeout:30000});
    self.wd = setInterval(function(){
      if(self.state==='ok' && Date.now()-self.lastFix>GPS_LOST_AFTER_MS){ self.state='perdida'; if(!self.lostLogged){ self.lostLogged=true; logEvent('chofer','gps_perdido'); } self.ui(); }
    },5000);
    self.fl = setInterval(function(){ self.flush(); }, FLUSH_INTERVAL_MS);
    return true;
  },
  flush:function(){
    if(!this.buffer.length) return;
    var batch=this.buffer.splice(0,100);
    lsSet('rec_pts_'+ctx.code,this.buffer);
    Q.add('rec_points',{p_code:ctx.code,p_points:batch});
  },
  stop:function(){
    if(this.watchId!=null){ navigator.geolocation.clearWatch(this.watchId); this.watchId=null; }
    clearInterval(this.wd); clearInterval(this.fl);
    while(this.buffer.length) this.flush();
    this.state='inactivo';
  },
  ui:function(){
    var el=document.getElementById('gpsbox'); if(!el) return;
    var s=this.state, txt='', cls='dot';
    if(s==='ok'){ txt='Ubicación activa'+(this.last?' (±'+Math.round(this.last.acc)+' m)':''); cls='dot pulse'; }
    else if(s==='buscando'){ txt='Buscando ubicación…'; cls='dot warn'; }
    else if(s==='perdida'){ txt='Ubicación perdida: se retoma sola'; cls='dot warn'; }
    else if(s==='denegado'){ txt='Ubicación bloqueada'; cls='dot bad'; }
    else if(s==='no_soportado'){ txt='Este teléfono no da ubicación'; cls='dot bad'; }
    else { txt='Ubicación apagada'; cls='dot warn'; }
    el.innerHTML='<span class="'+cls+'"></span><span>'+esc(txt)+'</span>';
    var ban=document.getElementById('gpsban');
    if(ban) ban.innerHTML = s==='denegado' ? '<div class="banner bad">Se bloqueó el permiso de ubicación. Actívalo en los ajustes del navegador para este sitio y recarga. El viaje sigue registrándose sin mapa.</div>' : '';
  }
};

/* ============ Arranque de cada rol ============ */
function startRole(role, code, shared){
  ctx.shared=!!shared;
  ctx.code=(code||'').toLowerCase().trim(); ctx.role=role; ctx.trip=null; clearTimers();
  $app.innerHTML='<div class="card"><p style="text-align:center">Abriendo…</p></div>';
  if(!/^[a-z0-9]{4,16}$/.test(ctx.code)){ errorView('Código no válido','Este código no existe. Pide que te envíen el enlace o el QR otra vez.'); return; }
  loadTrip().then(function(t){
    if(t.error){ errorView('Código no válido','Este código no existe. Pide que te envíen el enlace o el QR otra vez.'); return; }
    if(t.expired){ errorView('Este código ya venció','Pide un código nuevo para este viaje.'); return; }
    logOnce(role,'abre',null,deviceMeta());
    if(role==='chofer'){ logOnce('chofer','chofer_abre'); }
    var render = role==='mama'?viewMama:role==='gaby'?viewGaby:viewChofer;
    render();
    if(role==='chofer' && t.status==='en_curso'){ Geo.start(); Wake.on(); }
    startPolling(function(){ if(!document.activeElement || document.activeElement.tagName!=='TEXTAREA') render(); });
  }, function(){
    errorView('Sin internet','No se pudo abrir el viaje. Revisa tu conexión y vuelve a escanear.');
  });
}

function downloadQR(code){
  var q=QR.make(link('v',code),'M'), s=12, b=4, n=q.size+b*2, c=document.createElement('canvas'); c.width=c.height=n*s;
  var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.fillStyle='#000';
  for(var y=0;y<q.size;y++) for(var x=0;x<q.size;x++) if(q.modules[y][x]) g.fillRect((x+b)*s,(y+b)*s,s,s);
  var a=document.createElement('a'); a.download='qr-'+code+'.png'; a.href=c.toDataURL('image/png'); a.click();
}

/* ============ MAPA (mosaicos de OpenStreetMap, sin librerías) ============ */
var MAPW=600, MAPH=400;
function mapHtml(r, dest, opts){
  opts=opts||{};
  var pts=r.pts.slice(); if(!pts.length&&!dest) return '<p class="muted">Todavía no hay puntos de GPS para dibujar el mapa.</p>';
  var all=pts.map(function(p){ return {lat:p.lat,lng:p.lng}; }); if(dest) all.push({lat:dest.lat,lng:dest.lng});
  var merc=function(lat,lng,z){ var n=256*Math.pow(2,z), x=(lng+180)/360*n, sl=Math.sin(lat*Math.PI/180), y=(0.5-Math.log((1+sl)/(1-sl))/(4*Math.PI))*n; return {x:x,y:y}; };
  var minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;
  all.forEach(function(p){ minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);minLng=Math.min(minLng,p.lng);maxLng=Math.max(maxLng,p.lng); });
  var z=17, pad=50;
  for(;z>2;z--){ var a=merc(maxLat,minLng,z), b=merc(minLat,maxLng,z); if((b.x-a.x)<=MAPW-2*pad && (b.y-a.y)<=MAPH-2*pad) break; }
  var c=merc((minLat+maxLat)/2,(minLng+maxLng)/2,z), ox=c.x-MAPW/2, oy=c.y-MAPH/2;
  var X=function(lat,lng){ var m=merc(lat,lng,z); return m.x-ox; }, Y=function(lat,lng){ var m=merc(lat,lng,z); return m.y-oy; };
  var tx0=Math.floor(ox/256), tx1=Math.floor((ox+MAPW)/256), ty0=Math.floor(oy/256), ty1=Math.floor((oy+MAPH)/256), nT=Math.pow(2,z), tiles='';

function hav(a,b){ var R=6371000,d2r=Math.PI/180,dLat=(b.lat-a.lat)*d2r,dLng=(b.lng-a.lng)*d2r,x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*d2r)*Math.cos(b.lat*d2r)*Math.sin(dLng/2)*Math.sin(dLng/2); return 2*R*Math.asin(Math.sqrt(x)); }

    var kmh=function(v){ return v==null?'—':(v*3.6).toFixed(1)+' km/h'; };
    var step=function(n,a,b){ return '<span>'+n+'</span><b>'+(a&&b?fmtDur(b-a):'—')+'</b>'; };
    var h='<p><a href="#/admin">← Todos los viajes</a></p><h1>'+esc(t.label||t.code)+'</h1><p class="muted">Estado: '+esc(t.status)+' · código '+esc(t.code)+'</p>';
    h+='<div class="card"><h2 style="margin-top:0">Resumen</h2><div class="kv"><span>Salida real</span><b>'+fmtDT(t.started_at)+'</b><span>Llegada real</span><b>'+fmtDT(t.arrived_at)+'</b><span>Duración total</span><b>'+fmtDur(r.duration)+'</b><span>Distancia recorrida</span><b>'+(r.dist?(r.dist/1000).toFixed(2)+' km':'—')+'</b><span>Velocidad promedio (total)</span><b>'+kmh(r.avgAll)+'</b><span>Velocidad promedio (en movimiento)</span><b>'+kmh(r.avgMoving)+'</b><span>Velocidad máxima</span><b>'+kmh(r.vmax)+'</b><span>Tiempo en movimiento</span><b>'+fmtDur(r.moving)+'</b><span>Tiempo detenido</span><b>'+fmtDur(r.stopped)+'</b><span>Puntos de ubicación</span><b>'+r.points+'</b><span>Huecos de señal (&gt;60 s)</span><b>'+r.gaps+(r.gaps?' ('+fmtDur(r.gapMs)+')':'')+'</b></div></div>';
    h+='<div class="card"><h2 style="margin-top:0">Cadena de entrega</h2><div class="kv">'+step('Mamá abre → Mamá confirma',r.chain.abreMama,r.chain.mama)+step('Mamá confirma → Gaby confirma',r.chain.mama,r.chain.gaby)+step('Gaby confirma → Chofer abre',r.chain.gaby,r.chain.abreChofer)+step('Chofer abre → Salida',r.chain.abreChofer,r.chain.inicio)+step('Mamá abre → Salida (todo)',r.chain.abreMama,r.chain.inicio)+'</div></div>';
    h+='<div class="card"><h2 style="margin-top:0">Ruta</h2>'+mapHtml(r,(t.dest_lat!=null?{lat:t.dest_lat,lng:t.dest_lng}:null))+'</div>';
    h+='<div class="card"><h2 style="margin-top:0">Eventos</h2><table><tr><th>Hora</th><th>Quién</th><th>Qué</th><th>Detalle</th></tr>'+d.events.map(function(e){ return '<tr><td>'+fmtTime(e.client_ts||e.server_ts)+'</td><td>'+esc(e.role)+'</td><td>'+esc(EV_NAMES[e.type]||e.type)+'</td><td>'+esc(e.note||'')+(e.lat!=null?' <span class="muted">('+e.lat.toFixed(4)+', '+e.lng.toFixed(4)+')</span>':'')+'</td></tr>'; }).join('')+'</table></div>';
    h+='<div class="grid"><button class="btn" onclick="exportCSV(\''+code+'\')">Descargar puntos (CSV)</button><button class="btn" onclick="exportJSON(\''+code+'\')">Descargar todo (JSON)</button></div>';
    window._lastData=d;
    $app.innerHTML=h; fitMaps();
  },function(e){ $app.innerHTML='<p><a href="#/admin">←</a></p><div class="card">Error: '+esc(e.message)+'</div>'; });
}
function dl(name,mime,text){ var a=document.createElement('a'); a.download=name; a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.click(); }
function exportJSON(code){ dl('recorrido-'+code+'.json','application/json',JSON.stringify(window._lastData,null,2)); }
function exportCSV(code){
  var rows=['timestamp,lat,lng,precision_m,velocidad_ms,rumbo'].concat((window._lastData.points||[]).map(function(p){ return [p.ts,p.lat,p.lng,p.acc==null?'':p.acc,p.spd==null?'':p.spd,p.hdg==null?'':p.hdg].join(','); }));
  dl('recorrido-'+code+'-puntos.csv','text/csv',rows.join('\n'));
}

/* ============ Router ============ */
function route(){
  var h=(location.hash||'').replace(/^#\/?/,''), parts=h.split('/');
  $app.className='';
  if(Geo.watchId!=null && !(parts[0]==='c')){ /* nunca cortar el rastreo si navegan por error */ }
  switch(parts[0]){
    case 'v': return startShared(parts[1]);
    case 'm': return startRole('mama',parts[1]);
    case 'g': return startRole('gaby',parts[1]);
    case 'c': return startRole('chofer',parts[1]);
    case 'qr': return viewQR(parts[1]);
    case 'datos': return viewDatos(parts[1]);
    case 'vivo': return viewVivo(parts[1]);
    case 'admin': return viewAdmin();
    default:
      if(parts[0]&&/^[a-z0-9]{4,16}$/.test(parts[0])) return startRole('mama',parts[0]);
      if(!h) return errorView('Escanea el QR','Esta página se abre desde el código QR del viaje.');
      return errorView('Enlace no válido','Pide que te envíen el QR o el enlace otra vez.');
  }
}
window.addEventListener('hashchange',route);
window.addEventListener('beforeunload',function(e){ if(ctx.role==='chofer' && ctx.trip && ctx.trip.status==='en_curso'){ e.preventDefault(); e.returnValue=''; } });
Q.flush();
route();
</script>
</body>
</html>
