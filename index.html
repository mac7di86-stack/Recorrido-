<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2f33">
<meta name="robots" content="noindex,nofollow">
<title>Recorrido</title>
<style>
:root{
  --ink:#f6fbfa; --ink2:rgba(246,251,250,.78); --glass:rgba(255,255,255,.13); --glass2:rgba(255,255,255,.22);
  --edge:rgba(255,255,255,.34); --amber:#ffc65c; --amber2:#ff9f43; --mint:#7ee8b4; --mint2:#35c98a; --rose:#ff8a80; --sky:#7cc4ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.35;background:#0b2f33}
body{background:linear-gradient(160deg,#0a2a33 0%,#0d3f4a 45%,#143a63 100%) fixed;min-height:100vh;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:#1fa39a}
.blobs i:nth-child(2){width:50vmax;height:50vmax;right:-18vmax;top:25vh;background:#3b6fd8;animation-delay:-8s}
.blobs i:nth-child(3){width:42vmax;height:42vmax;left:10vw;bottom:-22vmax;background:#e6a23c;opacity:.38;animation-delay:-14s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,4vmax) scale(1.12)}}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom))}
#app.wide{max-width:920px}
h1{font-size:1.55rem;margin:.1rem 0 .3rem;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:0 0 .5rem}
p{margin:.35rem 0}
a{color:var(--sky)}
.muted{color:var(--ink2);font-size:.9rem}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:26px;padding:16px;margin:12px 0;
  -webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:0 12px 32px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08);animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.glass.flat{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:700;background:var(--glass2);border:1px solid var(--edge);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mint);flex:none}
.dot.warn{background:var(--amber)} .dot.bad{background:var(--rose)} .dot.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(126,232,180,.65)}100%{box-shadow:0 0 0 12px rgba(126,232,180,0)}}
.big{position:relative;overflow:hidden;width:100%;border:1px solid rgba(255,255,255,.55);border-radius:26px;padding:20px 16px;min-height:76px;font:inherit;font-size:1.28rem;font-weight:800;letter-spacing:-.01em;cursor:pointer;color:#1d1300;
  background:linear-gradient(180deg,#ffe08e,var(--amber2));box-shadow:0 10px 26px rgba(255,159,67,.35),inset 0 1px 0 rgba(255,255,255,.75);transition:transform .15s,filter .15s}
.big:active{transform:scale(.97)} .big[disabled]{filter:grayscale(.6) brightness(.8);cursor:wait}
.big.mint{color:#03301b;background:linear-gradient(180deg,#b6f7d6,var(--mint2));box-shadow:0 10px 26px rgba(53,201,138,.35),inset 0 1px 0 rgba(255,255,255,.75)}
.big.sky{color:#031d33;background:linear-gradient(180deg,#cfe9ff,var(--sky));box-shadow:0 10px 26px rgba(124,196,255,.3),inset 0 1px 0 rgba(255,255,255,.75)}
.big.rose{color:#3a0703;background:linear-gradient(180deg,#ffd0cb,var(--rose))}
.big small{display:block;font-size:.8rem;font-weight:600;opacity:.75;margin-top:2px}
.btn{font:inherit;font-weight:700;font-size:.98rem;color:var(--ink);cursor:pointer;min-height:54px;padding:12px;border-radius:20px;border:1px solid var(--edge);background:var(--glass2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .12s,background .15s}
.btn:active{transform:scale(.96);background:rgba(255,255,255,.34)}
.btn.sm{min-height:40px;padding:8px 12px;font-size:.88rem;border-radius:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gap{height:10px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);padding:14px;border-radius:16px;border:1px solid var(--edge);background:rgba(0,0,0,.22);outline:none}
input::placeholder,textarea::placeholder{color:rgba(246,251,250,.55)}
input:focus,textarea:focus{border-color:var(--amber)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.65);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* Qué está pasando */
.where{display:grid;gap:10px}
.where .row{display:flex;gap:12px;align-items:flex-start}
.where .ic{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--edge);font-size:1.05rem}
.where .lb{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:700}
.where .tx{font-size:1.08rem;font-weight:700}
.where .row.todo .tx{color:var(--amber)}
.hero-time{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
/* Stepper */
.stepper{position:relative;margin:6px 4px 2px;padding:0 0 6px}
.rail{position:absolute;left:12.5%;right:12.5%;top:22px;height:6px;border-radius:6px;background:rgba(255,255,255,.18)}
.rail b{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--mint2),var(--amber));transition:width 1.4s cubic-bezier(.3,.8,.3,1)}
.car{position:absolute;top:-17px;font-size:1.6rem;transform:translateX(-50%);transition:left 1.4s cubic-bezier(.3,.8,.3,1);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.car.bump{animation:bump .6s}
@keyframes bump{40%{transform:translateX(-50%) translateY(-8px) scale(1.2)}}
.nodes{position:relative;display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.node .c{width:34px;height:34px;margin:6px auto 6px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;border:2px solid var(--edge);background:rgba(11,47,51,.75);color:var(--ink2);transition:all .5s}
.node.done .c{background:var(--mint2);border-color:#fff;color:#03301b;animation:pop .5s}
.node.cur .c{background:var(--amber);border-color:#fff;color:#2a1700;box-shadow:0 0 0 0 rgba(255,198,92,.7);animation:pulseA 1.6s infinite}
.node.next .c{border-color:var(--amber);color:var(--amber)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulseA{0%{box-shadow:0 0 0 0 rgba(255,198,92,.7)}100%{box-shadow:0 0 0 14px rgba(255,198,92,0)}}
.node .n{font-size:.78rem;font-weight:800;line-height:1.1}
.node .t{font-size:.72rem;color:var(--ink2);margin-top:2px;line-height:1.15;min-height:2.3em}
.node.pend .n{opacity:.7}
/* Mapa */
.mapwrap{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;border-radius:22px;border:1px solid var(--edge);background:linear-gradient(135deg,#1c4c58,#1a3d63);box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.mapin{position:absolute;left:0;top:0;transform-origin:0 0}
.mapin img{filter:saturate(.8) brightness(.92)}
.mapph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:18px;color:var(--ink2);font-size:.92rem}
.attr{position:absolute;right:6px;bottom:3px;font-size:10px;background:rgba(0,0,0,.35);padding:0 5px;border-radius:4px}
/* varios */
.check{width:84px;height:84px;margin:4px auto 6px;display:block}
.check circle{fill:none;stroke:var(--mint);stroke-width:5;stroke-dasharray:252;stroke-dashoffset:252;animation:dr .7s .05s forwards}
.check path{fill:none;stroke:var(--mint);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:dr .5s .55s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.banner{border-radius:18px;padding:12px 14px;margin:10px 0;font-size:.95rem;border:1px solid var(--edge);background:rgba(255,198,92,.18)}
.banner.bad{background:rgba(255,138,128,.2)}
.banner.ok{background:rgba(126,232,180,.18)}
.log{margin:0;padding:0;list-style:none;font-size:.93rem}
.log li{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;gap:8px}
.log li:last-child{border:0}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.95rem}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{padding:6px;border-bottom:1px solid rgba(255,255,255,.16);text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:700}
.toast{width:max-content;position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:rgba(10,30,36,.85);border:1px solid var(--edge);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;z-index:20;opacity:0;transition:all .25s;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flash{position:fixed;inset:0;z-index:15;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.55),transparent 60%);opacity:0;animation:flash .9s}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:16;pointer-events:none;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.qrbox{background:#fff;padding:10px;border-radius:18px;display:inline-block;line-height:0}
.qrbox svg{width:240px;height:240px}
.who{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:.95rem}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{body{background:#fff!important}.blobs,.noprint{display:none!important}.glass{background:#fff;color:#000;border-color:#000;box-shadow:none}}
</style>
</head>

<script>
(function (root) {
  var ECC = { L: 1, M: 0 };
  var ECC_PER_BLOCK = {
    L: [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18],
    M: [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26]
  };
  var NUM_BLOCKS = {
    L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4],
    M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5]
  };

  function rawModules(ver) {
    var r = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      var n = Math.floor(ver / 7) + 2;
      r -= (25 * n - 10) * n - 55;
      if (ver >= 7) r -= 36;
    }
    return r;
  }
  function dataCodewords(ver, lvl) {
    return Math.floor(rawModules(ver) / 8) - ECC_PER_BLOCK[lvl][ver] * NUM_BLOCKS[lvl][ver];
  }
  function mul(x, y) {
    var z = 0;
    for (var i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z & 255;
  }
  function divisor(d) {
    var r = [], i, j;
    for (i = 0; i < d - 1; i++) r.push(0);
    r.push(1);
    var root = 1;
    for (i = 0; i < d; i++) {
      for (j = 0; j < d; j++) {
        r[j] = mul(r[j], root);
        if (j + 1 < d) r[j] ^= r[j + 1];
      }
      root = mul(root, 2);
    }
    return r;
  }
  function remainder(data, div) {
    var r = div.map(function () { return 0; });
    data.forEach(function (b) {
      var f = b ^ r.shift();
      r.push(0);
      div.forEach(function (c, i) { r[i] ^= mul(c, f); });
    });
    return r;
  }
  function utf8(str) {
    var s = unescape(encodeURIComponent(str)), out = [];
    for (var i = 0; i < s.length; i++) out.push(s.charCodeAt(i));
    return out;
  }
  function bit(x, i) { return ((x >>> i) & 1) !== 0; }

  function make(text, lvl) {
    lvl = lvl || 'M';
    var bytes = utf8(text), ver, bits = [];
    function push(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); }
    for (ver = 1; ver <= 10; ver++) {
      var ccBits = ver <= 9 ? 8 : 16;
      if (4 + ccBits + bytes.length * 8 <= dataCodewords(ver, lvl) * 8) break;
    }
    if (ver > 10) throw new Error('texto demasiado largo para el QR');
    push(4, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    bytes.forEach(function (b) { push(b, 8); });
    var cap = dataCodewords(ver, lvl) * 8;
    for (var t = 0; t < 4 && bits.length < cap; t++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    var data = [];
    for (var i = 0; i < bits.length; i += 8) {
      var v = 0;
      for (var j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      data.push(v);
    }
    for (var pad = 0xec; data.length < cap / 8; pad ^= 0xec ^ 0x11) data.push(pad);

    // ECC + interleave
    var nb = NUM_BLOCKS[lvl][ver], eccLen = ECC_PER_BLOCK[lvl][ver];
    var raw = Math.floor(rawModules(ver) / 8);
    var nShort = nb - (raw % nb), shortLen = Math.floor(raw / nb);
    var blocks = [], k = 0, div = divisor(eccLen);
    for (i = 0; i < nb; i++) {
      var dl = shortLen - eccLen + (i < nShort ? 0 : 1);
      var dat = data.slice(k, k + dl);
      k += dl;
      var ecc = remainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    var all = [];
    for (i = 0; i < blocks[0].length; i++) {
      blocks.forEach(function (blk, j) {
        if (i !== shortLen - eccLen || j >= nShort) all.push(blk[i]);
      });
    }

    var size = ver * 4 + 17, mod = [], fn = [];
    for (i = 0; i < size; i++) {
      mod.push(new Array(size).fill(false));
      fn.push(new Array(size).fill(false));
    }
    function setF(x, y, v) { mod[y][x] = v; fn[y][x] = true; }

    for (i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    function finder(x, y) {
      for (var dy = -4; dy <= 4; dy++) for (var dx = -4; dx <= 4; dx++) {
        var d = Math.max(Math.abs(dx), Math.abs(dy)), xx = x + dx, yy = y + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) setF(xx, yy, d !== 2 && d !== 4);
      }
    }
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    var pos = [];
    if (ver > 1) {
      var na = Math.floor(ver / 7) + 2;
      var step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (na * 2 - 2)) * 2;
      pos = [6];
      for (var p = size - 7; pos.length < na; p -= step) pos.splice(1, 0, p);
    }
    pos.forEach(function (a, ia) {
      pos.forEach(function (b, ib) {
        if ((ia === 0 && ib === 0) || (ia === 0 && ib === pos.length - 1) || (ia === pos.length - 1 && ib === 0)) return;
        for (var dy = -2; dy <= 2; dy++) for (var dx = -2; dx <= 2; dx++)
          setF(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
      });
    });
    function drawFormat(mask) {
      var d = (ECC[lvl] << 3) | mask, r = d;
      for (var q = 0; q < 10; q++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      var b = ((d << 10) | r) ^ 0x5412, q2;
      for (q2 = 0; q2 <= 5; q2++) setF(8, q2, bit(b, q2));
      setF(8, 7, bit(b, 6)); setF(8, 8, bit(b, 7)); setF(7, 8, bit(b, 8));
      for (q2 = 9; q2 < 15; q2++) setF(14 - q2, 8, bit(b, q2));
      for (q2 = 0; q2 < 8; q2++) setF(size - 1 - q2, 8, bit(b, q2));
      for (q2 = 8; q2 < 15; q2++) setF(8, size - 15 + q2, bit(b, q2));
      setF(8, size - 8, true);
    }
    drawFormat(0);
    if (ver >= 7) {
      var rr = ver;
      for (i = 0; i < 12; i++) rr = (rr << 1) ^ ((rr >>> 11) * 0x1f25);
      var vb = (ver << 12) | rr;
      for (i = 0; i < 18; i++) {
        var c = bit(vb, i), a = size - 11 + (i % 3), b2 = Math.floor(i / 3);
        setF(a, b2, c); setF(b2, a, c);
      }
    }
    // colocar datos
    var bi = 0;
    for (var right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (var vert = 0; vert < size; vert++) {
        for (var jj = 0; jj < 2; jj++) {
          var x = right - jj, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
          if (!fn[y][x] && bi < all.length * 8) { mod[y][x] = bit(all[bi >>> 3], 7 - (bi & 7)); bi++; }
        }
      }
    }
    function applyMask(m) {
      for (var y = 0; y < size; y++) for (var x = 0; x < size; x++) {
        var inv;
        switch (m) {
          case 0: inv = (x + y) % 2 === 0; break;
          case 1: inv = y % 2 === 0; break;
          case 2: inv = x % 3 === 0; break;
          case 3: inv = (x + y) % 3 === 0; break;
          case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
          case 5: inv = (x * y) % 2 + (x * y) % 3 === 0; break;
          case 6: inv = ((x * y) % 2 + (x * y) % 3) % 2 === 0; break;
          default: inv = ((x + y) % 2 + (x * y) % 3) % 2 === 0;
        }
        if (!fn[y][x] && inv) mod[y][x] = !mod[y][x];
      }
    }
    function penalty() {
      var score = 0, x, y, run, line, dark = 0;
      var pat1 = '10111010000', pat2 = '00001011101';
      function lineScore(s) {
        var sc = 0, r = 1, k2;
        for (k2 = 1; k2 < s.length; k2++) {
          if (s[k2] === s[k2 - 1]) { r++; if (r === 5) sc += 3; else if (r > 5) sc++; } else r = 1;
        }
        var idx = -1;
        while ((idx = s.indexOf(pat1, idx + 1)) >= 0) sc += 40;
        idx = -1;
        while ((idx = s.indexOf(pat2, idx + 1)) >= 0) sc += 40;
        return sc;
      }
      for (y = 0; y < size; y++) {
        line = ''; for (x = 0; x < size; x++) { line += mod[y][x] ? '1' : '0'; if (mod[y][x]) dark++; }
        score += lineScore(line);
      }
      for (x = 0; x < size; x++) {
        line = ''; for (y = 0; y < size; y++) line += mod[y][x] ? '1' : '0';
        score += lineScore(line);
      }
      for (y = 0; y < size - 1; y++) for (x = 0; x < size - 1; x++) {
        var c0 = mod[y][x];
        if (c0 === mod[y][x + 1] && c0 === mod[y + 1][x] && c0 === mod[y + 1][x + 1]) score += 3;
      }
      var total = size * size;
      score += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return score;
    }
    var best = 0, bestScore = Infinity;
    for (var m = 0; m < 8; m++) {
      applyMask(m); drawFormat(m);
      var ps = penalty();
      if (ps < bestScore) { bestScore = ps; best = m; }
      applyMask(m);
    }
    applyMask(best); drawFormat(best);
    return { size: size, version: ver, modules: mod, mask: best };
  }

  function svg(text, scale, lvl) {
    var q = make(text, lvl), s = scale || 6, border = 4, n = q.size + border * 2, d = '';
    for (var y = 0; y < q.size; y++) for (var x = 0; x < q.size; x++)
      if (q.modules[y][x]) d += 'M' + (x + border) + ',' + (y + border) + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" width="' + n * s + '" height="' + n * s +
      '" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
  }

  root.QR = { make: make, svg: svg };
  if (typeof module !== 'undefined') module.exports = root.QR;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>

/* ============ API + cola sin conexión ============ */
function rpcRaw(fn, args){
  return fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
    method:'POST', headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'}, body: JSON.stringify(args||{})
  }).then(function(r){
    return r.text().then(function(t){
      var j; try{ j = t ? JSON.parse(t) : null; }catch(e){ j = null; }
      if(!r.ok){ var err = new Error((j && (j.message||j.hint)) || ('http_'+r.status)); err.status = r.status; throw err; }
      return j;
    });
  });
}
function isRetryable(err){ return !(err && err.status && err.status<500 && err.status!==408 && err.status!==429); }
var Net = { ok:true, set:function(v){ if(this.ok!==v){ this.ok=v; paintNet(); } } };
function paintNet(){
  var d=document.getElementById('netdot'), x=document.getElementById('nettxt'); if(!d) return;
  var pend=Q.items().length;
  d.className='dot'+(Net.ok?'':' warn'); x.textContent=Net.ok?(pend?'Enviando…':'Conectado'):'Sin conexión · se guarda y se envía solo';
}
var Q = {
  key:'rec_queue', flushing:false,
  items:function(){ return lsGet(this.key, []); },
  add:function(fn,args){ var a=this.items(); a.push({fn:fn,args:args}); lsSet(this.key,a); this.flush(); },
  flush:function(){
    var self=this; if(self.flushing) return; self.flushing=true;
    function step(){
      var a=self.items();
      if(!a.length){ self.flushing=false; Net.set(true); paintNet(); return; }
      rpcRaw(a[0].fn,a[0].args).then(function(){ a=self.items(); a.shift(); lsSet(self.key,a); step(); },
        function(err){ if(!isRetryable(err)){ a=self.items(); a.shift(); lsSet(self.key,a); step(); } else { self.flushing=false; Net.set(false); setTimeout(function(){ self.flush(); },4000); } });
    }
    step();
  }
};
window.addEventListener('online', function(){ Q.flush(); });
window.addEventListener('offline', function(){ Net.set(false); });

/* ============ Geolocalización (teléfono de Barrón) ============ */
var Geo = {
  watchId:null, last:null, lastSaved:0, lastFix:0, buffer:[], state:'inactivo', lostLogged:false, wd:null, fl:null, hist:[], onFix:null,
  start:function(){
    var self=this;
    if(!navigator.geolocation){ self.state='no_soportado'; self.ui(); return false; }
    if(self.watchId!=null) return true;
    self.buffer = lsGet('rec_pts_'+ctx.code, []);
    self.lastFix = Date.now(); self.state='buscando'; self.ui();
    self.watchId = navigator.geolocation.watchPosition(function(p){
      var now=Date.now(); self.lastFix=now;
      var c=p.coords; self.last={lat:c.latitude,lng:c.longitude,acc:c.accuracy,spd:c.speed,hdg:c.heading,t:now};
      self.hist.push(self.last); if(self.hist.length>40) self.hist.shift();
      if(self.state!=='ok'){ if(self.lostLogged){ sendEvent('chofer','gps_recuperado'); self.lostLogged=false; } self.state='ok'; self.ui(); }
      if(self.onFix) try{ self.onFix(self.last); }catch(e){}
      if(now-self.lastSaved<GPS_MIN_INTERVAL_MS) return;
      self.lastSaved=now;
      self.buffer.push({lat:c.latitude,lng:c.longitude,acc:c.accuracy,spd:c.speed,hdg:c.heading,ts:new Date(p.timestamp||now).toISOString()});
      lsSet('rec_pts_'+ctx.code,self.buffer);
    }, function(e){
      if(e.code===1){ if(self.state!=='denegado'){ self.state='denegado'; sendEvent('chofer','gps_permiso_denegado'); self.ui(); } }
      else { if(self.state==='ok') self.state='perdida'; self.ui(); }
    }, {enableHighAccuracy:true,maximumAge:0,timeout:30000});
    self.wd = setInterval(function(){
      if(self.state==='ok' && Date.now()-self.lastFix>GPS_LOST_AFTER_MS){ self.state='perdida'; if(!self.lostLogged){ self.lostLogged=true; sendEvent('chofer','gps_perdido'); } self.ui(); }
    },5000);
    self.fl = setInterval(function(){ self.flush(); }, FLUSH_INTERVAL_MS);
    return true;
  },
  flush:function(){
    if(!this.buffer.length) return;
    var batch=this.buffer.splice(0,100); lsSet('rec_pts_'+ctx.code,this.buffer);
    Q.add('rec_points',{p_code:ctx.code,p_points:batch});
  },
  stop:function(){
    if(this.watchId!=null){ navigator.geolocation.clearWatch(this.watchId); this.watchId=null; }

  },
  pos:function(){ return (this.state==='ok'&&this.last)?this.last:null; },

    var el=document.getElementById('gpsbox'); if(!el) return;

    else if(s==='perdida'){ txt='Ubicación perdida · se retoma sola'; cls='dot warn'; }
    else if(s==='denegado'){ txt='Ubicación bloqueada'; cls='dot bad'; }
    else if(s==='no_soportado'){ txt='Este teléfono no da ubicación'; cls='dot bad'; }

/* ============ Registro de eventos ============ */
function sendEvent(role,type,note,meta){
  var pos=Geo.pos();
  var args={ p_code:ctx.code, p_client_id:uid(), p_role:role, p_type:type, p_note:note||null,
    p_lat:pos?pos.lat:null, p_lng:pos?pos.lng:null, p_acc:pos?pos.acc:null, p_ts:new Date().toISOString(), p_meta:meta||null };
  return rpcRaw('rec_event',args).then(function(r){ Net.set(true); r=r||{}; r.ts=r.ts||args.p_ts; return r; },
    function(err){
      if(!isRetryable(err)) return { error:'rechazado', detalle:err.message, ts:args.p_ts };
      Q.add('rec_event',args); Net.set(false); return { ok:true, encolado:true, ts:args.p_ts };
    });
}

var EV2STAGE={inicio:'a_gaby',llegada_gaby:'en_gaby',salida_gaby:'a_mama',llegada_mama:'en_mama',salida_mama:'a_destino',llegada_destino:'en_destino',fin:'fin'};
function applyLocal(role,type,ts,res){
  var t=ctx.trip; if(!t) return;
  t.events=(t.events||[]).concat([{role:role,type:type,note:null,meta:(res&&res.aviso)?{aviso:res.aviso}:null,ts:ts}]);
  t.done=(t.done||[]).concat([role+':'+type]);
  var tg=EV2STAGE[type];
  if(tg && !(res&&res.aviso&&res.aviso!=='salto_de_etapa') && sIdx(tg)>sIdx(t.stage)){
    t.stage=tg; if(type==='inicio'){ t.status='en_curso'; t.started_at=ts; } if(type==='fin'){ t.status='finalizado'; t.arrived_at=ts; }
  }
}
function register(role,type,opts){
  opts=opts||{};
  return sendEvent(role,type,opts.note,opts.meta).then(function(res){
    if(res.error){ toast('No se pudo guardar. Intenta otra vez.'); return res; }
    if(res.duplicado){ toast('Ya estaba registrado a las '+fmtTime(res.ts)); lsSet('rec_seen_'+ctx.code+'_'+role+'_'+type,res.ts); }
    else { applyLocal(role,type,res.ts,res); if(res.aviso) toast(avisoTxt(res.aviso)); }

var Eta={
  timer:null, flagged:{}, nearSent:{}, busy:false,
  start:function(){ var self=this; Geo.onFix=function(p){ self.onFix(p); }; if(!this.timer){ this.timer=setInterval(function(){ self.tick(); },ETA_EVERY_MS); } this.tick(); },
  stop:function(){ clearInterval(this.timer); this.timer=null; Geo.onFix=null; },

  },
  speed:function(){ var h=Geo.hist, d=0, s=0; for(var i=1;i<h.length;i++){ var dt=(h[i].t-h[i-1].t)/1000; if(dt<=0||dt>60) continue; var dd=hav(h[i-1],h[i]); if(dd/dt<0.8) continue; d+=dd; s+=dt; } return s>=20?d/s:null; },
  tick:function(){
    var t=ctx.trip, tg=currentTarget(t); if(!tg||this.busy) return;
    var pl=place(t,tg), pos=Geo.pos(), self=this, key=t.stage+tg;
    if(!pl||pl.lat==null||!pos){
      var motivo=(!pl||pl.lat==null)?'sin_coordenadas_destino':'sin_gps';

      .then(function(j){ clearTimeout(to); var r0=j&&j.routes&&j.routes[0]; if(!r0) throw new Error('sin_ruta'); return {dur:r0.duration,dist:r0.distance,src:'osrm'}; })

  if(e&&e.type==='eta_no_disponible'&&e.meta&&e.meta.to===tg) return {kind:'no',to:tg,motivo:e.meta.motivo};
  return {kind:'espera',to:tg};
}
function etaLine(t){
  var i=etaInfo(t); if(!i) return '';
  var nm=SHORT[i.to];
  if(i.kind==='eta'){
    var min=Math.max(0,Math.round((i.at-Date.now())/60000));
    var viejo=i.age>4*60000?' · dato de hace '+Math.round(i.age/60000)+' min':'';
    return 'Llega a '+nm+' a las <b>'+fmtTime(i.at)+'</b> (<span data-eta="'+i.at+'">'+(min<=0?'ya casi':'~'+min+' min')+'</span>)'+viejo;

  if(i.kind==='no') return i.motivo==='sin_gps'?'Sin hora estimada: el teléfono de Barrón no tiene ubicación.':'Sin hora estimada: aún no se conoce la ubicación de '+nm+'.';

}

/* ============ Stepper ============ */
var NODES=[['dif','DIF','1'],['gaby','Gaby','2'],['mama','Gloria','3'],['destino','Destino','4']];
function stepperBuild(){
  return '<div class="stepper"><div class="rail"><b id="railb" style="width:0"></b></div><div class="car" id="car" style="left:12.5%">🚗</div><div class="nodes">'+
    NODES.map(function(n,i){ return '<div class="node pend" id="nd'+i+'"><div class="c">'+n[2]+'</div><div class="n">'+n[1]+'</div><div class="t" id="nt'+i+'"></div></div>'; }).join('')+'</div></div>';
}
function nodeStates(t){
  var s=(t.status==='programado')?-1:sIdx(t.stage); if(t.status==='cancelado') s=-1;
  var arr=['pend','pend','pend','pend'];
  if(s<0) arr[0]='cur';
  else {
    arr[0]='done';
    arr[1]= s===0?'next': s===1?'cur':'done';
    arr[2]= s<=1?'pend': s===2?'next': s===3?'cur':'done';
    arr[3]= s<=3?'pend': s===4?'next': s===5?'cur':'done';
    if(s<=0) arr[2]='pend';
  }
  return {s:s,a:arr};
}
function carPos(t,s){
  if(s<0) return 0; if(s===1) return 1; if(s===3) return 2; if(s>=5) return 3;
  var from=s===0?'dif':s===2?'gaby':'mama', to=s===0?'gaby':s===2?'mama':'destino', a=place(t,from), b=place(t,to), v=t.last_point, frac=0.5;
  if(a&&b&&a.lat!=null&&b.lat!=null&&v){ var tot=hav(a,b), left=hav(v,b); if(tot>50) frac=Math.min(.95,Math.max(.05,1-left/tot)); }
  return (s===0?0:s===2?1:2)+frac;
}
function stepperUpdate(t){
  var ns=nodeStates(t), pos=carPos(t,ns.s), car=document.getElementById('car'); if(!car) return;
  var newLeft='calc(12.5% + '+(pos/3*75)+'%)';
  if(car.style.left!==newLeft){ car.style.left=newLeft; car.classList.remove('bump'); void car.offsetWidth; car.classList.add('bump'); }
  document.getElementById('railb').style.width=(pos/3*100)+'%';
  var arr=function(type){ return fmtTime(evTs(t,type)); };
  var times=[ t.started_at?('salió '+fmtTime(t.started_at)):'por salir',
    ns.s>=1?('llegó '+arr('llegada_gaby')+(ns.s>=2?'<br>salió '+arr('salida_gaby'):'')):(ns.s===0?etaShort(t,'gaby'):''),
    ns.s>=3?('llegó '+arr('llegada_mama')+(ns.s>=4?'<br>salió '+arr('salida_mama'):'')):(ns.s===2?etaShort(t,'mama'):''),
    ns.s>=5?('llegó '+arr('llegada_destino')):(ns.s===4?etaShort(t,'destino'):'') ];
  for(var i=0;i<4;i++){
    var el=document.getElementById('nd'+i), old=el.className, nw='node '+ns.a[i]; if(old!==nw){ el.className=nw; }
    document.getElementById('nt'+i).innerHTML=times[i];
  }
}
function etaShort(t,key){ var i=etaInfo(t); if(i&&i.to===key&&i.kind==='eta') return 'llega ~'+fmtTime(i.at); if(i&&i.to===key) return 'en camino'; return ''; }

/* ============ Mapa (mosaicos OSM + capa SVG) ============ */
var MAPW=600, MAPH=400;
function merc(lat,lng,z){ var n=256*Math.pow(2,z), x=(lng+180)/360*n, sl=Math.sin(lat*Math.PI/180), y=(0.5-Math.log((1+sl)/(1-sl))/(4*Math.PI))*n; return {x:x,y:y}; }
function mapHtml(t,veh,trail,opts){
  opts=opts||{};
  var ns=nodeStates(t), pts=[];
  var pl=(t.places||[]).filter(function(p){ return p.lat!=null; });
  pl.forEach(function(p){ pts.push({lat:p.lat,lng:p.lng}); });
  if(veh) pts.push({lat:veh.lat,lng:veh.lng});
  if(!pts.length) return '<div class="mapwrap"><div class="mapph"><div>🗺️<br>El mapa aparece en cuanto Barrón comparte su ubicación o se conocen los lugares.</div></div></div>';
  var minLat=90,maxLat=-90,minLng=180,maxLng=-180;
  pts.forEach(function(p){ minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);minLng=Math.min(minLng,p.lng);maxLng=Math.max(maxLng,p.lng); });
  var z=16,pad=56; for(;z>3;z--){ var a=merc(maxLat,minLng,z), b=merc(minLat,maxLng,z); if((b.x-a.x)<=MAPW-2*pad&&(b.y-a.y)<=MAPH-2*pad) break; }
  var c=merc((minLat+maxLat)/2,(minLng+maxLng)/2,z), ox=c.x-MAPW/2, oy=c.y-MAPH/2;
  var X=function(p){ return merc(p.lat,p.lng,z).x-ox; }, Y=function(p){ return merc(p.lat,p.lng,z).y-oy; };
  var tiles='', nT=Math.pow(2,z);
  for(var tx=Math.floor(ox/256);tx<=Math.floor((ox+MAPW)/256);tx++) for(var ty=Math.floor(oy/256);ty<=Math.floor((oy+MAPH)/256);ty++){
    if(ty<0||ty>=nT) continue; var wx=((tx%nT)+nT)%nT;
    tiles+='<img alt="" draggable="false" src="https://tile.openstreetmap.org/'+z+'/'+wx+'/'+ty+'.png" style="position:absolute;left:'+(tx*256-ox).toFixed(1)+'px;top:'+(ty*256-oy).toFixed(1)+'px;width:256px;height:256px" onerror="this.style.display=\'none\'">';
  }
  var svg='<svg width="'+MAPW+'" height="'+MAPH+'" style="position:absolute;left:0;top:0">';
  if(trail&&trail.length>1){ var d=trail.map(function(q,i){ return (i?'L':'M')+X({lat:q[0],lng:q[1]}).toFixed(1)+','+Y({lat:q[0],lng:q[1]}).toFixed(1); }).join('');
    svg+='<path d="'+d+'" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/><path d="'+d+'" fill="none" stroke="#35c98a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>'; }
  var nextKey=({0:'gaby',2:'mama',4:'destino'})[ns.s], nextP=nextKey?place(t,nextKey):null;
  if(veh&&nextP&&nextP.lat!=null) svg+='<line x1="'+X(veh)+'" y1="'+Y(veh)+'" x2="'+X(nextP)+'" y2="'+Y(nextP)+'" stroke="#ffc65c" stroke-width="4" stroke-dasharray="3 9" stroke-linecap="round"/>';
  var order=['dif','gaby','mama','destino'];
  (t.places||[]).forEach(function(p){
    if(p.lat==null) return; var i=order.indexOf(p.key), st=ns.a[i], col=st==='done'?'#35c98a':(st==='cur'||st==='next')?'#ffc65c':'#fff';
    svg+='<g transform="translate('+X(p).toFixed(1)+','+Y(p).toFixed(1)+')"><circle r="15" fill="'+col+'" stroke="#0b2f33" stroke-width="3"/><text y="5" text-anchor="middle" font-size="14" font-weight="800" fill="#0b2f33">'+(i+1)+'</text></g>';
  });
  if(veh){ var vx=X(veh).toFixed(1), vy=Y(veh).toFixed(1); svg+='<circle cx="'+vx+'" cy="'+vy+'" r="16" fill="#7cc4ff" opacity=".3"><animate attributeName="r" values="10;24;10" dur="2s" repeatCount="indefinite"/></circle><circle cx="'+vx+'" cy="'+vy+'" r="9" fill="#2f8cff" stroke="#fff" stroke-width="3"/>'; }
  svg+='</svg>';
  var chip='';
  if(veh&&nextP&&nextP.lat!=null) chip='<div style="position:absolute;left:8px;top:8px" class="chip">➜ '+esc(SHORT[nextKey])+' · '+fmtKm(hav(veh,nextP))+'</div>';
  return '<div class="mapwrap"><div class="mapin" style="width:'+MAPW+'px;height:'+MAPH+'px">'+tiles+svg+'</div>'+chip+'<div class="attr">© OpenStreetMap</div></div>'+
    '<p class="muted" style="margin:8px 2px 0">🔵 Barrón ahorita · 🟡 Siguiente punto · 🟢 Ya pasó · línea punteada: lo que falta</p>';
}
function fitMaps(){ var ws=document.querySelectorAll('.mapwrap'); for(var i=0;i<ws.length;i++){ var w=ws[i], inn=w.querySelector('.mapin'); if(!inn) continue; var k=w.clientWidth/MAPW; if(k>0) inn.style.transform='scale('+k+')'; } }
window.addEventListener('resize',fitMaps);

   {ev:'llegada_mama',label:'Llegué con Mamá',sub:'La Pradera',hint:'Cuando llegues con Doña Gloria, toca «Llegué con Mamá».',cls:'mint'},

/* ============ Acciones por rol ============ */
function confirmedBlock(t,type,txt){

  return '<div class="glass flat" style="text-align:center"><svg class="check" viewBox="0 0 90 90"><circle cx="45" cy="45" r="40"/><path d="M27 46 l13 13 l25 -28"/></svg><div style="font-weight:800;font-size:1.15rem">'+txt+'</div><div class="muted">Quedó registrado'+(ts?' a las '+fmtTime(ts):'')+'</div></div>';
}
function actHtml(t,role){
  var st=t.status;
  if(role==='admin') return adminAct(t);
  if(st==='cancelado') return '';

  if(role==='mama'){
    if(!doneHas(t,'mama','mama_confirma')&&!validEv(t,'mama_confirma')) return '<button class="big mint" id="b-main" onclick="mamaConfirm(this)">Estoy lista<small>Toca aquí y ya quedó</small></button>';
    return confirmedBlock(t,'mama_confirma','Gracias, Doña Gloria');
  }
  if(role==='gaby'){
    var ok=doneHas(t,'gaby','gaby_confirma')||validEv(t,'gaby_confirma');
    var h=ok?confirmedBlock(t,'gaby_confirma','Gracias, Gaby'):'<button class="big mint" id="b-main" onclick="gabyConfirm(this)">Recibí, confirmo<small>Toca aquí y ya quedó</small></button>';
    h+='<div class="glass flat"><h2>¿Pasó algo? (opcional)</h2><textarea id="gnote" rows="2" placeholder="Escribe aquí una nota"></textarea><div class="gap"></div><button class="btn" style="width:100%" onclick="gabyNote()">Guardar nota</button></div>';

  }
  /* chofer */

  if(st==='programado'){
    h2+='<div id="gpsban"></div><button class="big" id="b-main" onclick="choferPress(this)">'+p.label+'<small>'+p.sub+' · empieza a medir y a guardar la ubicación</small></button>';
    h2+='<div class="glass flat" style="margin-top:12px"><div class="chip" id="gpsbox"><span class="dot warn"></span><span>Ubicación apagada</span></div><p class="muted" style="margin:8px 2px 0">Pon el teléfono fijo en el carro y deja la pantalla encendida. Te va a pedir permiso de ubicación: toca «Permitir».</p></div>';
    return h2;
  }
  var startMs=new Date(t.started_at).getTime();
  h2+='<div id="gpsban"></div><button class="big '+p.cls+'" id="b-main" onclick="choferPress(this)">'+p.label+'<small>'+p.sub+'</small></button>';
  h2+='<div class="glass flat"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div class="muted">Llevamos</div><div class="hero-time" id="clock">'+clock(Date.now()-startMs)+'</div></div><div class="chip" id="gpsbox"><span class="dot warn"></span><span>…</span></div></div>'+

  return h2;
}
function waitFix(ms,cb){
  var t0=Date.now(); (function w(){ if(Geo.pos()||Geo.state==='denegado'||Geo.state==='no_soportado'||Date.now()-t0>ms) return cb(); setTimeout(w,200); })();
}
function choferPress(btn){
  var t=ctx.trip, p=driverPlan(t); if(!p||btn.disabled) return;
  if(p.ev==='fin'&&!confirm('¿Ya se bajó todo mundo y terminas el recorrido?')) return;
  btn.disabled=true;
  var go=function(){
    register('chofer',p.ev,{meta:p.ev==='inicio'?deviceMeta():null}).then(function(res){
      if(p.ev==='fin'){ Geo.flush(); Geo.stop(); Wake.off(); Eta.stop(); }
      else { Geo.start(); Eta.start(); }
      ctx.sig.act=null; refresh(true);
    });
  };
  if(p.ev==='inicio'){ Geo.start(); Wake.on(); waitFix(5000,go); } else go();
}
function choferEv(type,askNote){
  var note=null;
  if(askNote){ note=prompt('¿Qué pasó?',''); if(note===null) return; note=note.trim()||null; }
  sendEvent('chofer',type,note).then(function(r){ if(r.error) return toast('No se pudo guardar'); ctx.trip.events=(ctx.trip.events||[]).concat([{role:'chofer',type:type,note:note,meta:null,ts:r.ts}]); toast('Anotado '+fmtTime(r.ts)); refresh(); });
}
function mamaConfirm(btn){ btn.disabled=true; register('mama','mama_confirma').then(function(r){ if(!r.error) fx(); ctx.sig.act=null; refresh(true); }); }
function gabyConfirm(btn){ btn.disabled=true; register('gaby','gaby_confirma').then(function(r){ if(!r.error) fx(); ctx.sig.act=null; refresh(true); }); }
function gabyNote(){
  var el=document.getElementById('gnote'), v=(el.value||'').trim(); if(!v) return;
  sendEvent('gaby','nota',v).then(function(r){ if(r.error) return toast('No se pudo guardar'); ctx.trip.events=(ctx.trip.events||[]).concat([{role:'gaby',type:'nota',note:v,meta:null,ts:r.ts}]); el.value=''; toast('Nota guardada'); refresh(); });
}

/* ============ Pantalla del recorrido ============ */
function mount(){
  var role=ctx.role;
  var host=ctx.host||$app; if(!ctx.host) $app.className='';

   '<div class="glass" id="s-hero"></div><div id="s-act"></div><div class="glass flat" id="s-step">'+stepperBuild()+'</div><div class="glass flat" id="s-map"></div><div class="glass flat" id="s-who"></div><div class="glass flat" id="s-log"></div>'+
   (role==='admin'?'':'<p class="muted" style="text-align:center;margin-top:16px"><a href="#" onclick="return changeRole()">No soy '+esc(LBL[role])+'</a></p>');

}
function refresh(force){
  var t=ctx.trip, role=ctx.role; if(!t||!ctx.mounted) return;
  document.getElementById('s-hero').innerHTML=heroHtml(t,role);
  stepperUpdate(t);
  var veh=(role==='chofer'&&Geo.pos())?Geo.pos():t.last_point;
  var ms=JSON.stringify([veh&&Math.round(veh.lat*20000),veh&&Math.round(veh.lng*20000),(t.places||[]).map(function(p){ return p.lat; }),t.stage,t.status]);
  if(force||ctx.sig.map!==ms){ ctx.sig.map=ms; document.getElementById('s-map').innerHTML=mapHtml(t,veh,t.trail); fitMaps(); }
  var as=JSON.stringify([t.status,t.stage,doneHas(t,'mama','mama_confirma'),doneHas(t,'gaby','gaby_confirma'),!!validEv(t,'mama_confirma'),!!validEv(t,'gaby_confirma')]);
  var foc=document.activeElement&&document.activeElement.id==='gnote';
  if((force||ctx.sig.act!==as)&&!(foc&&!force)){ var keep=document.getElementById('gnote')?document.getElementById('gnote').value:''; ctx.sig.act=as; document.getElementById('s-act').innerHTML=actHtml(t,role); if(keep&&document.getElementById('gnote')) document.getElementById('gnote').value=keep; Geo.ui(); }
  document.getElementById('s-who').innerHTML=whoHtml(t);
  var lg=logHtml(t,6); var le=document.getElementById('s-log'); le.innerHTML=lg; le.style.display=lg?'':'none';
  /* cambios de etapa: animación y aviso */
  var idx=t.status==='finalizado'?7:(t.status==='programado'?-1:sIdx(t.stage));
  if(ctx.prevIdx!=null&&idx!==ctx.prevIdx&&idx>ctx.prevIdx){ fx(t.status==='finalizado'?'fin':'etapa'); var n=narrative(t,role); toast(n.w.replace(/<[^>]+>/g,'')); }
  if(role==='admin'&&ctx.prevIdx!=null&&idx>ctx.prevIdx&&Alarm.isOn()) Alarm.beep(2);
  ctx.prevIdx=idx;
  if(role==='admin'){ var am=ctx.alarmMsg; adminAlarms(t); if(am!==ctx.alarmMsg){ ctx.sig.act=null; document.getElementById('s-act').innerHTML=actHtml(t,role); } }
  tick1();
}
function tick1(){
  var now=Date.now(), a=document.querySelectorAll('[data-since]'), i;
  for(i=0;i<a.length;i++) a[i].textContent=clock(now-(+a[i].getAttribute('data-since')));
  var b=document.querySelectorAll('[data-eta]');
  for(i=0;i<b.length;i++){ var m=Math.round((+b[i].getAttribute('data-eta')-now)/60000); b[i].textContent=m<=0?'ya casi':'~'+m+' min'; }

/* ============ Análisis ============ */
function analyze(d){
  var ev=d.events, t=d.trip;
  var ts=function(e){ return new Date(e.client_ts||e.server_ts).getTime(); };
  var okEv=function(e){ return !(e.meta&&e.meta.aviso)||e.meta.aviso==='salto_de_etapa'; };
  var first=function(type){ var e=ev.filter(function(x){ return x.type===type&&okEv(x); })[0]; return e?ts(e):null; };
  var T={inicio:first('inicio'),lg:first('llegada_gaby'),sg:first('salida_gaby'),lm:first('llegada_mama'),sm:first('salida_mama'),ld:first('llegada_destino'),fin:first('fin')};
  var legs=[['DIF → Gaby','gaby',T.inicio,T.lg],['Gaby → Mamá','mama',T.sg,T.lm],['Mamá → Destino','destino',T.sm,T.ld]].map(function(L){
    var etas=ev.filter(function(e){ return e.type==='eta'&&e.meta&&e.meta.to===L[1]&&L[2]&&ts(e)>=L[2]&&(!L[3]||ts(e)<=L[3]); });
    var no=ev.filter(function(e){ return e.type==='eta_no_disponible'&&e.meta&&e.meta.to===L[1]&&L[2]&&ts(e)>=L[2]&&(!L[3]||ts(e)<=L[3]); });
    var f=etas[0], l=etas[etas.length-1];
    return {name:L[0],key:L[1],start:L[2],end:L[3],real:(L[2]&&L[3])?L[3]-L[2]:null,nEta:etas.length,nNo:no.length,
      etaFirstAt:f?new Date(f.meta.eta_ts).getTime():null,etaFirstDur:f?f.meta.dur_s*1000:null,etaFirstSrc:f?f.meta.src:null,
      etaLastAt:l?new Date(l.meta.eta_ts).getTime():null,etaLastTs:l?ts(l):null,
      errFirst:(f&&L[3])?L[3]-new Date(f.meta.eta_ts).getTime():null, errLast:(l&&L[3])?L[3]-new Date(l.meta.eta_ts).getTime():null};
  });
  var pts=d.points.filter(function(p){ return p.acc==null||p.acc<=100; }).map(function(p){ return {lat:p.lat,lng:p.lng,t:new Date(p.ts).getTime()}; });
  var dist=0,moving=0,stopped=0,gaps=0,gapMs=0;
  for(var i=1;i<pts.length;i++){ var dt=(pts[i].t-pts[i-1].t)/1000; if(dt<=0) continue; if(dt>60){ gaps++; gapMs+=dt*1000; continue; } var dd=hav(pts[i-1],pts[i]), v=dd/dt; if(v>70) continue; if(v<0.8) stopped+=dt*1000; else { moving+=dt*1000; dist+=dd; } }
  var missing=[];
  (d.places||[]).forEach(function(p){ if(p.lat==null) missing.push('Sin coordenadas de '+p.name); });
  if(!d.points.length) missing.push('Sin puntos de GPS en este recorrido');
  legs.forEach(function(L){ if(L.start&&L.nEta===0) missing.push('Sin hora estimada en el tramo '+L.name+(L.nNo?' ('+L.nNo+' aviso(s) de «no disponible»)':'')); });
  return {T:T,legs:legs,waitG:(T.lg&&T.sg)?T.sg-T.lg:null,waitM:(T.lm&&T.sm)?T.sm-T.lm:null,aboard:(T.sm&&T.ld)?T.ld-T.sm:null,total:(T.inicio&&(T.fin||T.ld))?(T.fin||T.ld)-T.inicio:null,
    mamaAtDest:T.ld,dist:dist,moving:moving,stopped:stopped,gaps:gaps,gapMs:gapMs,npts:d.points.length,pts:pts,missing:missing,
    avisos:ev.filter(function(e){ return e.meta&&e.meta.aviso; }).map(function(e){ return {type:e.type,aviso:e.meta.aviso,ts:ts(e)}; })};
}

    var h='<div class="glass flat"><h1>'+esc(t.label||t.code)+'</h1><p class="muted">Estado: '+esc(t.status)+' · día '+esc(t.day||'—')+' · código '+esc(t.code)+'</p></div>';
    h+='<div class="glass flat"><h2>Tiempos reales</h2><div class="kv"><span>Salida de DIF</span><b>'+fmtTimeS(r.T.inicio)+'</b><span>Llegada con Gaby · salida</span><b>'+fmtTimeS(r.T.lg)+' · '+fmtTimeS(r.T.sg)+'</b><span>Espera con Gaby</span><b>'+fmtDur(r.waitG)+'</b><span>Llegada con Mamá · salida</span><b>'+fmtTimeS(r.T.lm)+' · '+fmtTimeS(r.T.sm)+'</b><span>Espera con Mamá</span><b>'+fmtDur(r.waitM)+'</b><span>Mamá llegó al destino a las</span><b>'+fmtTimeS(r.mamaAtDest)+'</b><span>Mamá a bordo (salida → destino)</span><b>'+fmtDur(r.aboard)+'</b><span>Duración total</span><b>'+fmtDur(r.total)+'</b></div></div>';
    h+='<div class="glass flat"><h2>Estimado vs real por tramo</h2><table><tr><th>Tramo</th><th>Real</th><th>Estimado al salir</th><th>Error 1ª</th><th>Error última</th><th>#est.</th></tr>'+r.legs.map(function(L){ return '<tr><td>'+L.name+'</td><td>'+fmtDur(L.real)+'</td><td>'+(L.etaFirstDur!=null?fmtDur(L.etaFirstDur)+' <span class="muted">('+esc(L.etaFirstSrc)+')</span>':'—')+'</td><td>'+signedDur(L.errFirst)+'</td><td>'+signedDur(L.errLast)+'</td><td>'+L.nEta+'</td></tr>'; }).join('')+'</table><p class="muted">Error = hora real de llegada − hora estimada (positivo: llegó más tarde de lo estimado).</p></div>';
    h+='<div class="glass flat"><h2>GPS</h2><div class="kv"><span>Puntos guardados</span><b>'+r.npts+'</b><span>Distancia recorrida</span><b>'+(r.dist?(r.dist/1000).toFixed(2)+' km':'—')+'</b><span>Velocidad en movimiento</span><b>'+kmh+'</b><span>Tiempo en movimiento</span><b>'+fmtDur(r.moving)+'</b><span>Tiempo detenido</span><b>'+fmtDur(r.stopped)+'</b><span>Huecos de señal (&gt;60 s)</span><b>'+r.gaps+(r.gaps?' ('+fmtDur(r.gapMs)+')':'')+'</b></div></div>';
    if(r.missing.length||r.avisos.length) h+='<div class="glass flat"><h2>Datos que faltaron o avisos</h2><ul class="log">'+r.missing.map(function(m){ return '<li><span>'+esc(m)+'</span></li>'; }).join('')+r.avisos.map(function(a){ return '<li><span>'+esc(EV_NAMES[a.type]||a.type)+': '+esc(a.aviso.replace(/_/g,' '))+'</span><span class="muted">'+fmtTime(a.ts)+'</span></li>'; }).join('')+'</ul></div>';
    var tt={places:d.places,stage:t.stage,status:t.status};
    h+='<div class="glass flat"><h2>Ruta</h2>'+mapHtml(tt,r.pts.length?r.pts[r.pts.length-1]:null,r.pts.map(function(p){ return [p.lat,p.lng]; }))+'</div>';
    h+='<div class="glass flat"><h2>Eventos</h2><table><tr><th>Hora</th><th>Quién</th><th>Qué</th><th>Detalle</th></tr>'+d.events.map(function(e){ return '<tr><td>'+fmtTimeS(e.client_ts||e.server_ts)+'</td><td>'+esc(e.role)+'</td><td>'+esc(EV_NAMES[e.type]||e.type)+'</td><td>'+esc(e.note||'')+(e.meta?' <span class="muted">'+esc(JSON.stringify(e.meta))+'</span>':'')+(e.lat!=null?' <span class="muted">('+e.lat.toFixed(4)+', '+e.lng.toFixed(4)+')</span>':'')+'</td></tr>'; }).join('')+'</table></div>';
    h+='<div class="grid"><button class="btn" onclick="exportCSV(\''+code+'\')">Descargar puntos (CSV)</button><button class="btn" onclick="exportJSON(\''+code+'\')">Descargar todo (JSON)</button></div>';
    adminShell(h); fitMaps();
  },function(e){ adminShell('<div class="glass flat">Error: '+esc(e.message)+'</div>'); });
}
function dl(name,mime,text){ var a=document.createElement('a'); a.download=name; a.href=URL.createObjectURL(new Blob([text],{type:mime})); a.click(); }
function exportJSON(code){ dl('recorrido-'+code+'.json','application/json',JSON.stringify(window._lastData,null,2)); }
function exportCSV(code){ var rows=['timestamp,lat,lng,precision_m,velocidad_ms,rumbo'].concat((window._lastData.points||[]).map(function(p){ return [p.ts,p.lat,p.lng,p.acc==null?'':p.acc,p.spd==null?'':p.spd,p.hdg==null?'':p.hdg].join(','); })); dl('recorrido-'+code+'-puntos.csv','text/csv',rows.join('\n')); }

/* ============ Router ============ */
function route(){
  var h=(location.hash||'').replace(/^#\/?/,''), parts=h.split('/');
  ctx.host=null; ctx.pollAdmin=false; $app.className='';
  if(parts[0]!=='admin'&&parts[0]!=='datos'){ Alarm.stop(); }
  switch(parts[0]){
    case 'admin': return viewAdmin(parts[1]);
    case 'datos': return viewDatos(parts[1]);
    case 'v': return home((parts[1]||'').toLowerCase());
    case 'm': case 'g': case 'c': lsSet('rec_role',{m:'mama',g:'gaby',c:'chofer'}[parts[0]]); return home((parts[1]||'').toLowerCase());
    default: return home();
  }
}
window.addEventListener('hashchange',route);
Q.flush();
route();

</script>
